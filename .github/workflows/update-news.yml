name: 每日更新新聞與勞動部公告
on:
  workflow_dispatch:
  schedule:
    # Taiwan 09:00 / UTC 01:00
    - cron: '0 1 * * *'
permissions:
  contents: write
concurrency:
  group: labor-news-daily
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate sourced editorial digest and official notices
        run: python scripts/update_news.py
      - name: Rebuild Google sitemap
        run: python scripts/build_sitemap.py
      - name: Publish updated news data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/editorial.json sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh daily editorial news and official notices"
            git pull --rebase origin main
            git push
          fi
