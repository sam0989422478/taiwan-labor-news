name: 同步 Facebook 粉專動態
on:
  workflow_dispatch:
  schedule:
    - cron: '15 * * * *'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch authorized Facebook Page posts
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: python scripts/sync_facebook.py
      - name: Save public post cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/facebook-posts.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync Facebook Page posts"
            git push
          fi
