const embeddedEditorial={"updated_at":"2026-11-17T19:15:00+08:00","articles":[{"id":"20261117-parenting-subsidy-full-report","title":"育兒減工時不扣薪！企業最高補助135萬元，2027年元旦上路","date":"2026-11-17","published_at":"2026-11-17T19:15:00+08:00","category":"工資工時","source":"勞動部、中央社","source_title":"勞動部公布友善職場育兒彈性工作安排措施獎勵及補助要點","source_url":"https://www.mol.gov.tw/1607/1632/1633/101248/post","kind":"台灣勞基新聞網專題報導","summary":"勞動部11月17日公布育兒減工時、職代津貼與新聘替代人力三大補助。符合條件的企業，每年可申請最高135萬元減工時薪資補助，中小企業另有制度獎勵。","body":[{"heading":"企業主注意：育兒減工時補助即將上路","text":"勞動部2026年11月17日發布《友善職場育兒彈性工作安排措施獎勵及補助要點》，預定2027年1月1日起實施。企業若同意育有未滿12歲子女的受僱者每日減少至少一小時工作時間、且薪資照給，符合一定實施日數和累計時數條件後，可依實際照給薪資申請補助。這是政府鼓勵企業推動友善育兒措施的獎補助方案，並非所有勞工都可直接要求雇主無條件減時不減薪。"},{"heading":"三大補助：工資、職代津貼、替代人力","items":["育兒減少工作時間薪資補助：每月至少實施10日、累計至少3個月、減少工時合計達30小時，符合條件時每名受僱者每年最高補助4萬5,000元、每家企業每年最高135萬元。","職務代理津貼補助：企業符合規定並實際發給代理同事津貼，可依代理時數或日數申請每日800元、每小時100元的補助。","新聘替代人力招募補助：未滿200人的企業因產假或育嬰留職停薪另聘替代人力，符合定期契約至少3個月、連續工作30日等條件，可申請2萬元。"]},{"heading":"五項制度獎勵，中小企業最高15萬元","text":"對未滿200人的企業，勞動部提供建立友善育兒制度的定額獎勵，包括每日減時不扣薪、彈性調整上下班至少一小時、職務代理津貼、電傳勞動或居家辦公，以及優於法令的有薪親職活動假。制度須公告並持續實施至少一年，每項獎勵2萬元、五項最高10萬元；29人以下企業每項再加碼1萬元，五項最高15萬元。"},{"heading":"台灣勞基觀察：企業應先把制度做好","text":"這項政策看似是補助，實務上卻連動排班、人力交接、薪資紀錄與企業內部規章。企業若想兼顧正常營運與同仁育兒需求，事前規劃會比臨時應付更重要。實際申請資格、補助範圍和核定金額仍應以主管機關正式要點為準。"},{"heading":"企業主現在可以先做的三件事","items":["盤點育有12歲以下子女同仁的工作安排，評估是否適合設計彈性工時。","檢查工作規則、勞動契約、代理津貼與出勤薪資紀錄，避免新制度與既有規範衝突。","持續追蹤地方政府申請公告、補助應備文件、實施期間與核銷要求。"]},{"heading":"2027年元旦起申請","text":"依勞動部公告，企業可自2027年1月1日起透過友善職場育兒補助系統或紙本方式向地方政府申請，案件依規定審查核定。首次撥款仍須待年度預算完成法定程序。"}]},{"id":"9cc3b9b65a130a2b","title":"工資工時焦點｜有12歲以下子女勞工「如果企業同意」 申請減少工時不減薪 明年上路","date":"2026-11-17","published_at":"2026-11-17T18:39:35.350651+08:00","category":"工資工時","source":"UDN","source_title":"有12歲以下子女勞工「如果企業同意」 申請減少工時不減薪 明年上路 - UDN","source_url":"https://news.google.com/rss/articles/CBMiUEFVX3lxTE1nZnZCR1Q2VDR4M0M5WG5rQ1drcEtPODVvRm93VElsSGhRaHRtZktScEh6cVFFd181dFV3UlJtNS1RU2hMSUxCSTFwMlNWdTVU0gFWQVVfeXFMT1VCSU5XNUlvSzMzaUZrLTNFSm5YZjJoOUo3eFl6b0tZUGdSTjctd ,"如涉及新制，應先核對主管機關公布的適用日期"]},{"heading":"資料與查證","text":"資料來源：墨新聞-MORE News；來源日期：2026-11-17。本文為編輯導讀，完整事實與法規適用請查閱下方原始報導及主管機關公告。"}],"kind":"編輯導讀"},{"id":"20261117-flexible-parenting","title":"育兒減時不扣薪將有補助？企業先掌握三大補助與制度建立方向","date":"2026-11-17","published_at":"2026-11-17T18:00:00+08:00","category":"工資工時","source":"勞動部","source_title":"勞動部推出【友善職場育兒彈性工作安排措施】，『三大補助』支持企業育兒勞工減時不扣薪、同事職務代理加津貼，輔以『五項建立制度獎勵』，鼓勵企業友善職場，116年元旦上路","source_url":"https://www.mol.gov.tw/1607/1632/1633/101248/","summary":"勞動部11月17日宣布友善職場育兒彈性工作安排措施，預告116年元旦上路。企業應先了解補助方向與內部管理制度的配合需求。","body":[{"heading":"新政策有哪些重點？","text":"依勞動部11月17日發布的新聞稿標題，政策主軸包含育兒勞工減少工時但不減薪、職務代理同事加發津貼，以及鼓勵企業建立友善制度的相關獎勵。官方以「三大補助」和「五項建立制度獎勵」說明整體措施，預告2027年1月1日上路。"},{"heading":"對企業有什麼影響？","text":"企業安排育兒彈性工時時，不只需要關心員工申請資格，也要評估班表、職務代理、薪資處理與管理制度。相關補助額度、申請要件及施行細節，仍須查核主管機關完整公告，不能直接從新聞標題推定所有企業均適用。"},{"heading":"企業主現在可以先做的三件事","items":["盤點現有育兒員工的工時安排及請假制度","檢視代理人力與交接流程是否能運作","追蹤勞動部公告的補助資格、申請方式及正式實施日期"]},{"heading":"台灣勞基編輯提醒","text":"這項措施屬於政策資訊整理，不代表所有企業立即符合補助資格；實際作業應依正式規定與核定結果辦理。"}],"kind":"編輯導讀"},{"id":"20261117-vote-leave","title":"投票日碰到原本工作日怎麼辦？企業排班別忽略依法給假","date":"2026-11-17","published_at":"2026-11-17T18:00:00+08:00","category":"工資工時","source":"勞動部","source_title":"115年11月28日(星期六)為115年地方公職人員選舉及全國性公民投票日，具投票權且該日原屬工作日之勞工，依法放假一日","source_url":"https://www.mol.gov.tw/1607/1632/1633/100094/","summary":"11月28日地方公職人員選舉與公投即將到來，勞動部提醒具有投票權、且當天原本是工作日的勞工，依法放假一日。","body":[{"heading":"企業排班要注意什麼？","text":"勞動部11月13日新聞稿指出，2026年11月28日（星期六）為地方公職人員選舉及全國性公民投票日，具投票權且當日原屬工作日的勞工，依法放假一日。企業應先確認個別員工是否符合公告所述條件。"},{"heading":"不要只看星期六","text":"選舉日是否影響出勤安排，仍要依照員工原定工作日與相關法規認定；不同排班制度不宜一概而論。出勤與工資的細節應再核對勞動部完整公告。"},{"heading":"企業主可以先做的三件事","items":["確認員工11月28日的原定班表及工作日","事前和員工溝通投票安排並保留紀錄","如需當日出勤，先核對適用規定及工資處理方式"]},{"heading":"台灣勞基編輯提醒","text":"本文依勞動部公開標題與日期整理。個案是否適用、出勤工資認定，應參照公告全文及現行規定。"}],"kind":"編輯導讀"}]};
