<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="台灣勞基新聞網：勞動新聞編輯導讀與企業管理提醒"><title>新聞報導｜台灣勞基新聞網</title><style>
:root{--navy:#122e4b;--red:#c93143}*{box-sizing:border-box}body{font:16px/1.9 system-ui,-apple-system,"Noto Sans TC",sans-serif;margin:0;background:#f5f7fa;color:#24384d}a{color:#a72638}.wrap{width:min(800px,calc(100% - 36px));margin:auto}header{background:#fff;border-bottom:1px solid #dfe7ef;padding:20px 0}header a{font-weight:850;font-size:1.3rem;text-decoration:none;color:var(--navy)}main{padding:32px 0 55px}.article{padding:clamp(21px,5vw,44px);background:white;border:1px solid #dfe7ef;border-radius:13px}h1{font-size:clamp(1.65rem,4vw,2.35rem);line-height:1.45;color:var(--navy);margin:10px 0 14px}h2{font-size:1.22rem;color:var(--navy);margin-top:30px}p{margin:10px 0 20px}.meta{color:#687b90;font-size:.85rem}.tag{color:#ae2639;background:#f8e9eb;padding:4px 10px;border-radius:6px;font-weight:700;font-size:.83rem}li{margin:9px 0}.source{background:#f0f4f8;border-left:4px solid var(--red);padding:16px;margin-top:30px;overflow-wrap:anywhere}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.actions a{text-decoration:none;font-weight:800;padding:9px 14px;border-radius:7px;background:var(--navy);color:white}.actions a:last-child{background:#eef2f7;color:var(--navy)}footer{background:#102b46;color:white;padding:20px 0;font-size:.8rem}footer a{color:white}
</style></head><body><header><div class="wrap"><a href="./">台灣勞基新聞網</a></div></header><main class="wrap"><article class="article" id="article"><p>正在載入新聞……</p></article></main><footer><div class="wrap">台灣勞基新聞網｜編輯導讀 · 勞動新聞 · 企業管理資訊</div></footer><script>
const root=document.getElementById('article');const id=new URLSearchParams(location.search).get('id');function e(tag,value,cls){const x=document.createElement(tag);x.textContent=value||'';if(cls)x.className=cls;return x}
function link(url,label){const a=e('a',label);a.href=url;a.target='_blank';a.rel='noopener noreferrer';return a}
fetch('data/editorial.json?t='+Date.now()).then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{const x=(d.articles||[]).find(a=>a.id===id);root.replaceChildren();if(!x){root.append(e('p','找不到這篇新聞，可能已被更新或移除。'));return}document.title=x.title+'｜台灣勞基新聞網';root.append(e('span',x.category,'tag'),e('h1',x.title),e('div',(x.date||'')+' · 台灣勞基新聞網編輯整理 · 來源：'+(x.source||''),'meta'));for(const section of x.body||[]){root.append(e('h2',section.heading));if(section.text)root.append(e('p',section.text));if(section.items){const ul=e('ul');section.items.forEach(t=>ul.append(e('li',t)));root.append(ul)}}const source=e('div','','source');source.append(e('strong','原始新聞來源'),e('p',x.source_title||x.title),link(x.source_url,'查看來源報導與完整事實'));root.append(source);const acts=e('div','','actions');const home=e('a','返回最新新聞');home.href='./#news';acts.append(home,link('https://www.lawki.com.tw/site.html','台灣勞基官方網站'));root.append(acts);}).catch(()=>root.textContent='文章暫時無法讀取，請稍後重試。');
</script></body></html>
